name: Compilar APK ClickTv

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Descomprimir y preparar proyecto
      run: |
        unzip -o *.zip
        if [ -d "ClickTvPlayer24x7" ]; then
          cp -r ClickTvPlayer24x7/* .
          cp -r ClickTvPlayer24x7/.* . 2>/dev/null || true
        fi
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew || true

    - name: Compilar APK Debug
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Guardar APK generado
      uses: actions/upload-artifact@v4
      with:
        name: ClickTv-Player-APK
        path: '**/build/outputs/apk/debug/*.apk'
        
