name: Compilar APK ClickTv

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Descomprimir proyecto
      run: |
        unzip -o *.zip
        if [ ! -f "gradlew" ]; then
          DIR=$(find . -maxdepth 2 -name gradlew -printf '%h\n' | head -n 1)
          if [ -n "$DIR" ] && [ "$DIR" != "." ]; then
            cp -r $DIR/* .
          fi
        fi
        chmod +x gradlew

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Guardar APK generado
      uses: actions/upload-artifact@v4
      with:
        name: ClickTv-Player-APK
        path: '**/build/outputs/apk/debug/*.apk'
        
